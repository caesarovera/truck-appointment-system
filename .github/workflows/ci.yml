# Gerbang kualitas otomatis. Menjalankan PERSIS perintah yang dipakai lokal
# (composer lint/analyse/test · npm run test:js/type-check/build) supaya "hijau di
# laptop" dan "hijau di CI" berarti hal yang sama. Kalau perintahnya berubah di
# composer.json/package.json, ubah di sini juga.
#
# Penjelasan lengkap + cara baca kegagalan: docs/SETUP-GUIDE.md §14.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push beruntun ke branch yang sama: batalkan run lama yang sudah tak relevan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Pint · PHPStan · Pest
    runs-on: ubuntu-latest

    # ADR-0007 slice D1: test jalan di MySQL sungguhan, bukan lagi sqlite :memory:.
    # Ini BUKAN kerapian — sqlite tak menerbitkan `SELECT ... FOR UPDATE`, jadi test
    # konkurensi booking (tests/Concurrency) mustahil jujur di atasnya.
    #
    # Ditambahkan bersama D1, bukan ditunda ke D3: begitu `composer test` menuntut MySQL,
    # workflow tanpa service container ini akan MERAH di push berikutnya. Gerbang yang
    # dibiarkan rusak beberapa slice = gerbang yang orang belajar abaikan.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          # DB dasar. Pest --parallel menumbuhkan tas_testing_test_1..N sendiri saat
          # runtime (butuh hak CREATE DATABASE — itu sebabnya konek sebagai root).
          MYSQL_DATABASE: tas_testing
        ports:
          - 3306:3306
        # Tanpa healthcheck, step Pest bisa mulai sebelum MySQL selesai inisialisasi
        # dan gagal konek — kegagalan yang terlihat seperti bug test, padahal timing.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

      # Slice D3'. WAJIB ada, bukan pelengkap: tanpa Redis, tests/Feature/Hardening/
      # RedisUniqueJobTest DILEWATI diam-diam (by design, supaya PHP Windows native tetap
      # bisa menjalankan suite) — dan gerbang yang dilewati di CI sama saja dengan tak ada.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pcntl/posix dibutuhkan Horizon. Di Windows keduanya tak ada — makanya
          # dev lokal perlu --ignore-platform-req (lihat SETUP-GUIDE §3b). Di Linux
          # keduanya tersedia, jadi CI TIDAK memakai flag itu: composer install di
          # sini memverifikasi dependensi apa adanya, tanpa pengecualian.
          # gd: dipakai endroid/qr-code (PngWriter) buat generate gambar QR
          # on-demand (§AA) — cuma "suggest" di composer.json paketnya (bukan
          # require keras), jadi composer install tak akan gagal kalau ini
          # lupa ditambah, tapi QrImageTest akan meledak runtime. Eksplisit di
          # sini biar tak bergantung asumsi "ubuntu runner biasanya sudah ada gd".
          # pdo_mysql: WAJIB sejak D1 — test berjalan di MySQL (lihat services: di atas).
          # pdo_sqlite/sqlite3 dipertahankan: .env.example masih DB_CONNECTION=sqlite dan
          # dipakai perintah artisan di luar test.
          # redis: dibutuhkan RedisUniqueJobTest (slice D3'). Tanpa ekstensi ini test
          # tersebut otomatis skip, dan gerbangnya tak berlaku di CI.
          extensions: pcntl, posix, pdo_mysql, pdo_sqlite, sqlite3, mbstring, gd, redis
          coverage: none

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependensi
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Siapkan .env + APP_KEY
        # Test butuh APP_KEY (enkripsi/hash). Kredensial DB TIDAK ditaruh di sini —
        # diberikan sebagai env pada step Pest, lihat catatan di sana.
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (format)
        run: composer lint

      - name: PHPStan level 8
        # !cancelled() = tetap jalan walau step sebelumnya merah. Tujuannya: satu
        # push melaporkan SEMUA gerbang yang rusak, bukan cuma yang pertama gagal.
        if: ${{ !cancelled() }}
        run: composer analyse

      - name: Pest
        if: ${{ !cancelled() }}
        # phpunit.xml sudah memuat nilai default yang cocok untuk mesin dev (port 3307,
        # karena laragon memakai 3306 di sana). Di CI port-nya 3306. PHPUnit TIDAK
        # menimpa env var yang sudah ada di environment — tanpa force="true" — jadi
        # nilai di sini menang tanpa perlu menyentuh phpunit.xml.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tas_testing
          DB_USERNAME: root
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_CLIENT: phpredis
        run: composer test

  frontend:
    name: Frontend — Vitest · vue-tsc · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          # Samakan dengan mesin dev supaya beda versi tak jadi sumber "hijau lokal,
          # merah di CI".
          node-version: '22'
          cache: npm

      - name: Install dependensi
        # `npm ci` (bukan `npm install`): patuh pada package-lock.json, jadi CI
        # menguji versi yang sama persis dengan yang terkunci di repo.
        run: npm ci

      - name: Vitest
        run: npm run test:js

      - name: Type-check (vue-tsc)
        if: ${{ !cancelled() }}
        run: npm run type-check

      - name: Build produksi
        # Build ikut jadi gerbang: error yang cuma muncul saat bundling (import
        # circular, aset hilang) tak tertangkap Vitest maupun vue-tsc.
        if: ${{ !cancelled() }}
        run: npm run build
