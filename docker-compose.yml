# docker-compose.yml — truck-appointment-system
#
# ADR-0007. Service masuk per slice, bukan sekaligus — lihat CLAUDE.md §Peran Agent
# (no overengineering).
#   D1  : mysql              ✅
#   D2' : app                ✅  (containerisasi app DIMAJUKAN dari D4 — lihat catatan di bawah)
#   D3' : redis + horizon    ✅
#   D6' : scheduler + reverb ✅
#
# KENAPA app dimajukan mendahului Redis: D2 versi lama menaruh Redis lebih dulu, padahal
# app masih native Windows saat itu — dan PHP Windows native tak punya klien Redis. Satu-
# satunya cara memenuhinya adalah memasang DLL ext-redis ke php.ini laragon, yang akan
# terbuang begitu app pindah ke container. Memindahkan app lebih dulu membuat `pecl install
# redis` di dalam image cukup, tanpa menyentuh mesin dev sama sekali.
#
# Sekali setelah clone, dan SETIAP composer.lock berubah (composer require / git pull):
#            docker compose run --rm --no-deps app composer install
#            (vendor/ container ada di volume sendiri — lihat x-php. `composer install` di
#            Windows TETAP perlu untuk IDE/PHPStan/test native; keduanya terpisah.)
# Jalankan:  docker compose up -d
# Cek sehat: docker compose ps          (mysql & redis: STATUS harus "healthy")
# Masuk app: docker compose exec app bash
# Log:       docker compose logs -f app horizon scheduler reverb
# Matikan:   docker compose down        (data TETAP — ada di volume mysql-data & redis-data)
# Reset total (HAPUS DATA): docker compose down -v
#
# JANGAN nyalakan bersamaan dengan jalur native: `composer dev` / `php artisan serve`
# (port 8000 → diam-diam pindah ke 8001, dengan DB SQLite yang berbeda) atau
# `php artisan reverb:start` (port 8080 bentrok).

name: tas

# ---------------------------------------------------------------------------
# Definisi bersama SEMUA service PHP (app, horizon, scheduler, reverb).
#
# KENAPA anchor, bukan salinan per service: env yang berbeda antar service PHP adalah bug
# yang DIAM. Worker dengan QUEUE_CONNECTION beda dari pendorong job tak pernah mengambil
# job-nya; publisher broadcast dengan REVERB_HOST beda tak pernah sampai ke Reverb. Tak ada
# error di kedua kasus — antrian/realtime cuma diam. Dengan empat service, "jaga supaya
# salinannya sama persis" bukan lagi pengaman yang realistis.
#
# Catatan YAML: `<<:` menggabung secara DANGKAL. Service yang menulis ulang `environment:`
# atau `depends_on:` MENGGANTI seluruh map, bukan menambah — pakai `<<: *php-depends`
# di dalamnya (lihat horizon).
# ---------------------------------------------------------------------------
x-php-env: &php-env
  # Env var sungguhan menang atas .env: Laravel memuat dotenv secara immutable, jadi baris
  # di sini tak perlu mengubah berkas .env milik dev (yang tetap berisi nilai jalur native).
  APP_ENV: local
  # Di dalam jaringan compose, MySQL dipanggil lewat NAMA SERVICE dan port INTERNAL 3306 —
  # bukan 127.0.0.1:3307 yang cuma berlaku dari Windows.
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-tas}
  DB_USERNAME: root
  DB_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
  # Redis (slice D3'). Nama service + port internal.
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_CLIENT: phpredis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  # Broadcast (slice D6'). REVERB_HOST di sini = alamat Reverb DILIHAT DARI CONTAINER, dipakai
  # PHP untuk PUBLISH event. Browser TIDAK memakai nilai ini — Echo membaca VITE_REVERB_* dari
  # .env host (localhost:8080) yang diteruskan port mapping service `reverb`. Dua alamat untuk
  # server yang sama, karena `localhost` di dalam container = container itu sendiri. Sebelum
  # D6' nilai `localhost` dari .env ikut terbaca di sini, dan publish dari horizon tak pernah
  # bisa sampai ke Reverb native di Windows.
  # Test tak terpengaruh: phpunit.xml memaksa BROADCAST_CONNECTION=null (force="true").
  BROADCAST_CONNECTION: reverb
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  # Log harian (laravel-YYYY-MM-DD.log, simpan 14 hari) — `single` di .env tumbuh tanpa batas
  # (29 MB saat audit 2026-09-16, sebagian besar penolakan bisnis yang kini tak lagi dilaporkan).
  LOG_STACK: daily

x-php-depends: &php-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  restart: unless-stopped
  # Kode masuk lewat bind mount, BUKAN COPY ke image: edit di editor langsung terlihat tanpa
  # rebuild. Konsekuensinya di Windows, bind mount menembus NTFS dan setiap stat() berkas
  # menyeberang ke Windows (milidetik, bukan mikrodetik).
  volumes:
    - .:/var/www/html
    # vendor/ di named volume Linux, MENIMPA vendor/ dari bind mount (hanya di dalam container —
    # vendor/ di Windows tetap utuh untuk IDE/PHPStan/test native).
    # KENAPA: satu request Laravel memuat ~925 berkas, 816 di antaranya vendor/. OPcache dengan
    # validate_timestamps=1 men-stat semuanya lewat bind mount → median 3,4 dtk per request API.
    # Dengan vendor/ di sini: 0,13 dtk beruntun, 0,64 dtk setelah idle; kode app (~106 berkas)
    # tetap lewat bind mount, jadi edit tetap terlihat ≤2 dtk. Diukur, bukan ditebak.
    # HARGA: dua `composer install` (Windows + `docker compose run --rm --no-deps app composer
    # install`) setiap composer.lock berubah. Lupa yang container → error "Class not found"
    # yang keras, bukan salah diam.
    # Ini MEMBALIK keputusan D2′ (ADR-0007) yang menolak volume vendor karena "IDE & PHPStan di
    # host jadi buta" — alasan itu hanya benar kalau host tak punya vendor/ sendiri.
    # KHUSUS DEV. Di produksi kode + vendor dipanggang ke image, tanpa volume untuk kode.
    - vendor:/var/www/html/vendor
  environment: *php-env
  depends_on: *php-depends

services:
  mysql:
    image: mysql:8.4
    container_name: tas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      # DB dev. DB test (`tas_testing`) dibuat oleh skrip init, lihat docker/mysql/init/.
      MYSQL_DATABASE: ${DB_DATABASE:-tas}
    ports:
      # KIRI = port di Windows, KANAN = port di dalam container.
      # 3307, BUKAN 3306: laragon sudah memakai 3306 di mesin dev ini. Kalau dipaksa
      # 3306, container gagal bind dan errornya ("port is already allocated") sering
      # disalahartikan sebagai MySQL-nya yang rusak.
      # 127.0.0.1 di depan (semua service): tanpa itu port terbuka di SEMUA antarmuka — terbukti
      # MySQL (password dev `secret`) & Redis (tanpa password) terjangkau lewat IP Wi-Fi.
      - '127.0.0.1:${DB_PORT_HOST:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      # Skrip init HANYA jalan saat volume masih kosong (container pertama kali dibuat).
      # Kalau menambah/mengubah skrip di sini, wajib `docker compose down -v` dulu.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Dipakai supaya `docker compose up --wait` dan CI tahu kapan MySQL SIAP MELAYANI,
      # bukan sekadar "prosesnya hidup". MySQL butuh belasan detik untuk inisialisasi
      # pertama; tanpa healthcheck, migrasi yang jalan terlalu cepat akan gagal konek.
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_ROOT_PASSWORD:-secret}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tas-redis
    restart: unless-stopped
    # appendonly: queue Redis menyimpan JOB. Tanpa persistensi, `docker compose restart`
    # membuang seluruh antrian yang belum diproses — termasuk reminder H-2 jam yang sudah
    # dijadwalkan. Untuk dev ini berlebihan, tapi murah dan menghindari kebingungan
    # "kok job-nya hilang".
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # 6379 di mesin dev ini bebas (sudah dicek). Tetap lewat variabel supaya mudah
      # digeser kalau kelak bentrok, pola sama dengan MySQL.
      - '127.0.0.1:${REDIS_PORT_HOST:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    <<: *php
    container_name: tas-app
    # Perintah default dari Dockerfile: `php artisan serve --host=0.0.0.0 --port=8000`.
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:8000'

  horizon:
    <<: *php
    container_name: tas-horizon
    # INILAH yang tak pernah bisa jalan di mesin dev sebelum containerisasi: Horizon
    # menuntut ext-pcntl, dan PHP Windows native tak punya. Image Linux punya.
    command: ['php', 'artisan', 'horizon']
    depends_on:
      <<: *php-depends
      # Horizon-lah yang mem-PUBLISH broadcast (ShouldBroadcast = job di antrian). Ini cuma
      # urutan start, bukan jaminan siap; publish yang gagal masuk failed jobs, tidak hilang diam.
      reverb:
        condition: service_started

  scheduler:
    <<: *php
    container_name: tas-scheduler
    # Tanpa service ini TAK ADA yang menjalankan routes/console.php: NoShowSweepJob (tiap 5
    # menit) dan sanctum:prune-expired (harian) cuma terdaftar, tak pernah jalan — tidak di
    # container, tidak juga di `composer dev`. Test tetap hijau karena test memanggil job-nya
    # langsung, jadi gap ini tak pernah merah di mana pun (ditemukan saat analisa D6').
    # schedule:work = loop yang memanggil schedule:run tiap menit (pengganti cron di dev).
    # Job yang dijadwalkan didorong ke Redis lalu DIEKSEKUSI oleh horizon, bukan di sini.
    # SATU instance saja — dua scheduler = setiap sweep terkirim dua kali.
    command: ['php', 'artisan', 'schedule:work']

  reverb:
    <<: *php
    container_name: tas-reverb
    # Server WebSocket. Sebelum D6' jalan native di Windows (dan masih BISA — Reverb tak butuh
    # ext-pcntl); dipindah supaya publish dari horizon punya alamat yang pasti: `reverb:8080`.
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
    ports:
      # KANAN wajib 8080 (= REVERB_PORT di x-php-env). KIRI = port yang dibuka ke browser, dan
      # HARUS sama dengan VITE_REVERB_PORT di .env host — Echo di browser membaca nilai itu saat
      # Vite build/dev, bukan dari container.
      - '127.0.0.1:${REVERB_PORT_HOST:-8080}:8080'

volumes:
  mysql-data:
    name: tas-mysql-data
  redis-data:
    name: tas-redis-data
  # vendor/ milik container (lihat x-php). Aman dihapus kapan saja (`docker volume rm
  # tas-vendor`) — isinya bisa dibuat ulang dengan `composer install`, beda dengan data MySQL.
  vendor:
    name: tas-vendor
