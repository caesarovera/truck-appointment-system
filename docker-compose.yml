# docker-compose.yml — truck-appointment-system
#
# ADR-0007. Service masuk per slice, bukan sekaligus — lihat CLAUDE.md §Peran Agent
# (no overengineering).
#   D1  : mysql            ✅
#   D2' : app              ✅  (containerisasi app DIMAJUKAN dari D4 — lihat catatan di bawah)
#   D3' : redis + horizon  ✅
#   next: reverb (opsional)
#
# KENAPA app dimajukan mendahului Redis: D2 versi lama menaruh Redis lebih dulu, padahal
# app masih native Windows saat itu — dan PHP Windows native tak punya klien Redis. Satu-
# satunya cara memenuhinya adalah memasang DLL ext-redis ke php.ini laragon, yang akan
# terbuang begitu app pindah ke container. Memindahkan app lebih dulu membuat `pecl install
# redis` di dalam image cukup, tanpa menyentuh mesin dev sama sekali.
#
# Jalankan:  docker compose up -d
# Cek sehat: docker compose ps          (kolom STATUS harus "healthy")
# Masuk app: docker compose exec app bash
# Matikan:   docker compose down        (data TETAP — ada di volume mysql-data)
# Reset total (HAPUS DATA): docker compose down -v

name: tas

services:
  mysql:
    image: mysql:8.4
    container_name: tas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      # DB dev. DB test (`tas_testing`) dibuat oleh skrip init, lihat docker/mysql/init/.
      MYSQL_DATABASE: ${DB_DATABASE:-tas}
    ports:
      # KIRI = port di Windows, KANAN = port di dalam container.
      # 3307, BUKAN 3306: laragon sudah memakai 3306 di mesin dev ini. Kalau dipaksa
      # 3306, container gagal bind dan errornya ("port is already allocated") sering
      # disalahartikan sebagai MySQL-nya yang rusak.
      - '${DB_PORT_HOST:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      # Skrip init HANYA jalan saat volume masih kosong (container pertama kali dibuat).
      # Kalau menambah/mengubah skrip di sini, wajib `docker compose down -v` dulu.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Dipakai supaya `docker compose up --wait` dan CI tahu kapan MySQL SIAP MELAYANI,
      # bukan sekadar "prosesnya hidup". MySQL butuh belasan detik untuk inisialisasi
      # pertama; tanpa healthcheck, migrasi yang jalan terlalu cepat akan gagal konek.
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_ROOT_PASSWORD:-secret}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tas-redis
    restart: unless-stopped
    # appendonly: queue Redis menyimpan JOB. Tanpa persistensi, `docker compose restart`
    # membuang seluruh antrian yang belum diproses — termasuk reminder H-2 jam yang sudah
    # dijadwalkan. Untuk dev ini berlebihan, tapi murah dan menghindari kebingungan
    # "kok job-nya hilang".
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # 6379 di mesin dev ini bebas (sudah dicek). Tetap lewat variabel supaya mudah
      # digeser kalau kelak bentrok, pola sama dengan MySQL.
      - '${REDIS_PORT_HOST:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tas-app
    restart: unless-stopped
    # Kode masuk lewat bind mount, BUKAN COPY ke image: edit di editor langsung
    # terlihat tanpa rebuild. Konsekuensinya di Windows, bind mount menembus NTFS
    # dan I/O PHP (autoload ribuan berkas kecil) jadi lebih lambat — diukur, bukan
    # ditebak; angkanya ada di docs/SETUP-GUIDE.md §17.
    volumes:
      - .:/var/www/html
    environment:
      # Di dalam jaringan compose, MySQL dipanggil lewat NAMA SERVICE dan port
      # INTERNAL 3306 — bukan 127.0.0.1:3307 yang cuma berlaku dari Windows.
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tas}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      # Env var sungguhan menang atas .env: Laravel memuat dotenv secara immutable,
      # jadi baris di sini tak perlu mengubah berkas .env milik dev.
      APP_ENV: local
      # Redis (slice D3'). Di dalam jaringan compose: nama service + port internal.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    ports:
      - '${APP_PORT:-8000}:8000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tas-horizon
    restart: unless-stopped
    # INILAH yang tak pernah bisa jalan di mesin dev sebelum containerisasi: Horizon
    # menuntut ext-pcntl, dan PHP Windows native tak punya. Image Linux punya.
    command: ['php', 'artisan', 'horizon']
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tas}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      APP_ENV: local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      # WAJIB sama persis dengan service `app`. Kalau worker memakai store/connection
      # berbeda dari yang mendorong job, job tak akan pernah terambil — dan gejalanya
      # membingungkan: tak ada error, antrian cuma diam.
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
    name: tas-mysql-data
  redis-data:
    name: tas-redis-data
